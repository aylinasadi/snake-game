<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="startScreen">
        <div class="startCard">
            <h1>Snake Game</h1>
            <p id="author">Created by Aylin Asadi</p>
            <p id="instructions">Use arrow keys or WASD to control the snake</p>
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="gameOverCard">
            <h1>Game Over!</h1>
            <p id="finalScore">Score: 0</p>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>

    <h1 id="scoreDisplay">Score: 0</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        const startScreen = document.getElementById("startScreen");
        const startButton = document.getElementById("startButton");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const playAgainButton = document.getElementById("playAgainButton");
        const finalScore = document.getElementById("finalScore");
        const scoreDisplay = document.getElementById("scoreDisplay");

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            const hue = (Date.now() / 50) % 360;

            ctx.fillStyle = `hsl(${hue}, 100%, 64%)`;
            ctx.shadowColor = `hsl(${hue}, 100%, 64%)`;
            ctx.shadowBlur = 18;

            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
            ctx.shadowBlur = 0;
        };

        drawGame();

        let gameRunning = true;

        // Movement (game loop), Eating and growing, Game over
        const moveSnake = () => {
            if (!gameRunning) return;

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            if (newHead.x < 0 || newHead.x >= tileCount ||
                newHead.y < 0 || newHead.y >= tileCount)
                {
                    gameRunning = false;
                    clearInterval(gameLoop);
                    endGame();
                    return;
                }
            
            const hitBody = snake.some(segment => segment.x === newHead.x && segment.y === newHead.y);

            if (hitBody) {
                gameRunning = false;
                clearInterval(gameLoop);
                endGame();
                return;
            }
            
            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } else {
                snake.pop();
            }

            drawGame();
        };

        let gameLoop;

        const endGame = () => {
            gameRunning = false;
            clearInterval(gameLoop);
            finalScore.textContent = `Score: ${score}`;
            gameOverScreen.style.display = "flex";
        };

        const startGame = () => {
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            gameRunning = true;
            gameLoop = setInterval(moveSnake, 200);
        };

        startButton.addEventListener("click", () => {
            startButton.disabled = true;
            startGame();
        });

        playAgainButton.addEventListener("click", () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            scoreDisplay.textContent = "Score: 0";
            drawGame();
            startGame();
        });

        // Keyboard controls
        document.addEventListener("keydown", (event) => {
            const key = event.key.toLocaleLowerCase();

            if (key === "arrowup" || key === "w") {
                if (direction.y !== 1) {
                     direction = { x: 0, y: -1 };
                }
            } else if (key === "arrowdown" || key === "s") {
                if (direction.y !== -1) {
                    direction = { x: 0, y: 1 };
                }
            } else if (key === "arrowleft" || key === "a") {
                if (direction.x !== 1) {
                direction = { x: -1, y: 0 };
                }
            } else if (key === "arrowright" || key === "d") {
                if (direction.x !== -1) {
                    direction = { x: 1, y: 0 };
                }
            }
        });

        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
